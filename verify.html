
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NEXORA | التحقق</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card">
        <img class="auth-logo"
             src="{{ url_for('static', filename='images/logo.jpg') }}"
             alt="NEXORA">

        <span class="auth-eyebrow">EMAIL VERIFICATION</span>
        <h1>تأكيد البريد الإلكتروني</h1>

        <p class="auth-description">
            أرسلنا رمز التحقق إلى:
            <strong>{{ email }}</strong>
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="auth-alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" class="auth-form">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

            <label>رمز التحقق</label>
            <input type="text" name="code"
                   placeholder="000000"
                   inputmode="numeric"
                   pattern="[0-9]{6}"
                   maxlength="6"
                   minlength="6"
                   required>

            <button class="auth-button primary" type="submit">
                تأكيد الحساب
            </button>
        </form>

        <form method="POST" action="{{ url_for('resend_code') }}">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <button class="auth-button secondary" type="submit">
                إعادة إرسال الرمز
            </button>
        </form>
    </section>
</main>
</body>
</html>
